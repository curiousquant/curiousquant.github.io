<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sermons by JMun">
    <meta name="keywords" content="HTML, Template, Header">
    <meta name="author" content="JMun">
    <title>Sermons</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
    <link rel="icon" href="favicon.ico" type="image/x-icon"> <!-- Optional favicon -->
    <!-- Add any additional meta tags or external resources here -->
    <script>
        fetch('https://raw.githubusercontent.com/curiousquant/curiousquant.github.io/refs/heads/main/sample.json')
            .then(response => response.json()) // Parse JSON
            .then(data => {console.log(data)
                const obj = JSON.parse(data);

                document.getElementById("sermon_text").innerHTML=obj[1].name;
                }) // Work with JSON data
            .catch(error => console.error('Error fetching JSON:', error));
        
    </script>
</head>

<body>
   <h1>Sermons</h1>
   <p id="sermon_text">text</p>
</body>

</html>
