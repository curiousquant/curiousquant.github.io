   <h1>Sermons</h1>
   <p id="sermon_text">text</p>

<footer>
    <script>
        async function fetchText(){
            try{
                const response = await fetch('https://raw.githubusercontent.com/curiousquant/curiousquant.github.io/refs/heads/main/sample.json');
                const text = await response.json();
                return text;
            }
            catch(error){
                console.log(error);
            }
        }
        async function renderText(id){
            const value = await fetchText();
            console.log(value[0]);
            document.getElementById("sermon_text").innerHTML=value[id].text;
        }
        renderText(1);
        const h2 = document.getElementById("sermon_text");
        console.log(document.getElementById("sermon_text").innerHTML);
        let html = "<a href=\"/1\">1</a>";
        h2.insertAdjacentHTML("afterend", html);
            
    </script>
</footer>
