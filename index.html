<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sermons by JMun">
    <meta name="keywords" content="HTML, Template, Header">
    <meta name="author" content="JMun">
    <title>Sermons</title>
    <!-- <link rel="stylesheet" href="styles.css"> Link to your CSS file -->
    <!-- <link rel="icon" href="favicon.ico" type="image/x-icon"> Optional favicon -->
    <!-- Add any additional meta tags or external resources here -->
    <style>
        
        body {
            font-family: Georgia, Helvetica, sans-serif;
        }
        p {
        margin-left: 20px;
        margin-right: 20px;
        white-space: pre-wrap;
        }
        li{
            display: inline;
            margin-right: 3px;
        }
        img{
            width: 150px;
        }
        
    </style>
    <a href="/"><img src="cross.jpeg"/> </a>
</head>

<body onload="loadPage()">
   <h1>Sermons</h1>
   <p id="date"></p>
   <p id="sermon_text"></p>
   <ul id="links">
        <li >index</li>
        <li id="link0"></li>
   </ul>
</body>
<footer>
    <script>
        var minlink=1;
        async function fetchMetadata(){
            try{
                const url = "./";
                const response = await fetch(url+"metadata.json");
                
                const data = await response.json();
                console.log(data);
                return data;
            }
            catch(error){
                console.log(error);
            }
        }
        
        async function fetchText(id){
            try{
                const data = await fetchMetadata();
                const length = data.length;
                
                const title = data[id].text.title;
                console.log(title);
                const url = "./sermons/";
                             
                const response = await fetch(url+title+".txt");
                
                const text = await response.text();
                console.log(text);
                return text;
            }
            catch(error){
                console.log(error);
            }
        }
        
        async function renderText(id){
            try{
                const metaData = await fetchMetadata();
                const date = metaData[id].text.date;
                const value = await fetchText(id);

                console.log(value);
                document.getElementById("date").innerHTML=date;
                document.getElementById("sermon_text").innerHTML=value;
                
            }
            catch(error){
                console.log(error);
            }
        }
        //renderText(1);
        async function moveLeft(){
            try{
                const metadata = await fetchMetadata();
                const length = metadata.length;

                //const length=10;
                const incre = 5;
                if(minlink>1){
                    minlink=minlink-1;
                    for(let i=1;i<=length;i++){
                        //document.getElementById("link"+i).classList.add("vishidden");
                        document.getElementById("link"+i).style.display="none";
                        
                    }
                    for(let i=minlink;i<=minlink+incre;i++){
                        //document.getElementById("link"+i).classList.remove("vishidden");
                        document.getElementById("link"+i).style.display="inline";
                        
                        
                    }
                }
                

            }
            catch(error){
                console.log(error);
            }
        }
        async function moveRight(){
            try{
                const metadata = await fetchMetadata();
                const length = metadata.length;
                //const length =10;
                const incre =5;
                if(Number(minlink)+incre<length){
                   minlink=Number(minlink)+1;
                    console.log(minlink);
                    for(let i=1;i<=length;i++){
                        //document.getElementById("link"+i).classList.add("vishidden");
                        document.getElementById("link"+i).style.display="none";
                        
                    }
                    for(let i=Number(minlink);i<=minlink+incre;i++){
                        
                        //document.getElementById("link"+i).classList.remove("vishidden");
                        document.getElementById("link"+i).style.display="inline";
                        console.log(i+"+"+minlink);
                    }
                }
                console.log("--------");

            }
            catch(error){
                console.log(error);
            }
        }
        async function renderLinks(){
            try{
            
                const metadata = await fetchMetadata();
                const length = metadata.length;
               // const length = 10;
                const leftarrow = "<li id=leftarrow>&larr;</li>";
                const rightarrow = "<li id=rightarrow>&rarr;</li>";
                const h2 = document.getElementById("link0");
                h2.insertAdjacentHTML("afterend", rightarrow); 
                document.getElementById("rightarrow").addEventListener("click",moveRight);
                for (let i =0;i<length;i++) {
                    const linkNum=i+1;
                    
                    const h2 = document.getElementById("link"+i);
                    let html = "<li id=link"+linkNum+"><a href=\"/?text="+i+"\">"+i+"</a></li>";
                    
                    //let html = "<li id=link"+linkNum+">"+i+"</li>";
                    h2.insertAdjacentHTML("afterend", html); 
                }
                h2.insertAdjacentHTML("afterend", leftarrow); 
                document.getElementById("leftarrow").addEventListener("click",moveLeft);
               intializeLinks();
                
            }
            catch(error){
                console.log(error);
            }

        
        }
       
        
        async function intializeLinks(){
            try{
            const metadata = await fetchMetadata();
            const length = metadata.length;
           // const length = 10;
            const incre=5;
            console.log("minlink"+minlink);
           if(minlink==1){
            minlink=Number(minlink)+1;
           }
            
            for(let i=1;i<=length;i++){
                        //document.getElementById("link"+i).classList.add("vishidden");
                document.getElementById("link"+i).style.display="none";
                
            }
            let limit = Number(incre)+Number(minlink);
            for(let i=minlink;(i<limit)&&(i<=length);i++){
                //document.getElementById("link"+i).classList.remove("vishidden");
                console.log(i+"+"+incre+minlink+""+limit+"!!");
                console.log(document.getElementById("link"+i).getHTML());
                document.getElementById("link"+i).style.display="inline";
                
                
            }
            
            
        }
        catch(error){
            console.log(error);
        }
        }

        async function loadPage(){
            try{
            const metaData = await fetchMetadata();
            const length = metaData.length;

            const queryString = window.location.search;
            console.log(queryString);
            const urlParams = new URLSearchParams(queryString);
            const textid = urlParams.get('text')
            console.log(textid);
            if(textid==null || textid>(length-1)){
                let zero = 0;
                for(let i=0;i<length;i++){
                    if(metaData[i].text.id==0){
                        zero = i;
                        minlink=1;
                        console.log("start")
                        renderLinks();
                        intializeLinks()
                    }
                }
                console.log(zero);
                renderText(zero); 
                
            }
            else{
                let index = 0;
                for(let i=0;i<length;i++){
                    if(metaData[i].text.id==textid){
                        index = i;
                        minlink=textid;
                        console.log("textid"+textid);
                        renderLinks();
                        intializeLinks()

                    }
                }
                renderText(index);
                
            }    
            
            }
            catch(e){
                console.log(e);
            }
        }
        







        




    </script>
</footer>
</html>
